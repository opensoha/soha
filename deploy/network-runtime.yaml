# Prerequisite: create `soha-network-runtime-tls` in namespace `soha` with
# network-control.crt/key, ingest.crt/key, client-ca.crt, and separately issued
# network-gateway-control.crt/key/ca.crt, network-gateway-ingest.crt/key/ca.crt,
# and network-core-ingest-query.crt/key/ca.crt.
# Keep private keys outside source control and issue certificates for the deployed service names.
# Build and load the :local images described in README.md, or replace both image
# references with tested builds. Released v0.1.7/v0.1.8 lack these runtime binaries.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soha-ingest-postgres-data
  namespace: soha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soha-ingest-postgres
  namespace: soha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soha-ingest-postgres
  template:
    metadata:
      labels:
        app: soha-ingest-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.5-pg18-trixie
          args:
            - postgres
            - -c
            - shared_preload_libraries=pg_stat_statements
            - -c
            - compute_query_id=on
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              value: soha_ingest
            - name: POSTGRES_USER
              value: pgsql
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soha-app-config
                  key: ingest-postgres-password
          startupProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command: [sh, -ec, 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: soha-ingest-postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: soha-ingest-postgres
  namespace: soha
spec:
  selector:
    app: soha-ingest-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soha-network-control
  namespace: soha
spec:
  replicas: 1
  selector:
    matchLabels:
      app: soha-network-control
  template:
    metadata:
      labels:
        app: soha-network-control
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: network-control
          image: ghcr.io/opensoha/soha:local
          imagePullPolicy: IfNotPresent
          args:
            - /app/network-control
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: SOHA_CONFIG_FILE
              value: /app/configs/config.yaml
            - name: SOHA_NETWORK_CONTROL_DATABASE_HOST
              value: soha-postgres
            - name: SOHA_NETWORK_CONTROL_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soha-app-config
                  key: postgres-password
            - name: SOHA_SECURITY_CREDENTIAL_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: soha-app-config
                  key: credential-encryption-key
            - name: SOHA_NETWORK_CONTROL_TLS_CERT_FILE
              value: /run/soha-network-control/tls.crt
            - name: SOHA_NETWORK_CONTROL_TLS_KEY_FILE
              value: /run/soha-network-control/tls.key
            - name: SOHA_NETWORK_CONTROL_TLS_CLIENT_CA_FILE
              value: /run/soha-network-control/client-ca.crt
          ports:
            - containerPort: 8082
              name: https
          startupProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /readyz
              port: https
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: runtime-tls
              mountPath: /run/soha-network-control
              readOnly: true
      volumes:
        - name: runtime-tls
          secret:
            secretName: soha-network-runtime-tls
            defaultMode: 0440
            items:
              - key: network-control.crt
                path: tls.crt
              - key: network-control.key
                path: tls.key
              - key: client-ca.crt
                path: client-ca.crt
---
apiVersion: v1
kind: Service
metadata:
  name: soha-network-control
  namespace: soha
spec:
  type: LoadBalancer
  selector:
    app: soha-network-control
  ports:
    - name: https
      port: 8082
      targetPort: https
---
