  ports:
    - name: https
      port: 8083
      targetPort: https
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soha-network-gateway-data
  namespace: soha
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: soha-network-gateway
  namespace: soha
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: soha-network-gateway
  template:
    metadata:
      labels:
        app: soha-network-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
      containers:
        - name: network-gateway
          image: ghcr.io/opensoha/soha-network-gateway:local
          imagePullPolicy: IfNotPresent
          args:
            - run
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          env:
            - name: SOHA_NETWORK_GATEWAY_RUNTIME_ID
              value: gateway-default
            - name: SOHA_NETWORK_GATEWAY_DEVICE_ID
              value: gateway-default
            - name: SOHA_NETWORK_GATEWAY_CONTROL_URL
              value: https://soha-network-control:8082
            - name: SOHA_NETWORK_GATEWAY_CONTROL_CERT_FILE
              value: /run/soha-network-gateway/control/tls.crt
            - name: SOHA_NETWORK_GATEWAY_CONTROL_KEY_FILE
              value: /run/soha-network-gateway/control/tls.key
            - name: SOHA_NETWORK_GATEWAY_CONTROL_CA_FILE
              value: /run/soha-network-gateway/control/ca.crt
            - name: SOHA_NETWORK_GATEWAY_CONTROL_SERVER_NAME
              value: soha-network-control
            - name: SOHA_NETWORK_GATEWAY_INGEST_URL
              value: https://soha-ingest:8083
            - name: SOHA_NETWORK_GATEWAY_INGEST_CERT_FILE
              value: /run/soha-network-gateway/ingest/tls.crt
            - name: SOHA_NETWORK_GATEWAY_INGEST_KEY_FILE
              value: /run/soha-network-gateway/ingest/tls.key
            - name: SOHA_NETWORK_GATEWAY_INGEST_CA_FILE
              value: /run/soha-network-gateway/ingest/ca.crt
            - name: SOHA_NETWORK_GATEWAY_INGEST_SERVER_NAME
              value: soha-ingest
            - name: SOHA_NETWORK_GATEWAY_PRIVATE_KEY_FILE
              value: /var/lib/soha-network-gateway/wireguard.key
            - name: SOHA_NETWORK_GATEWAY_EGRESS_INTERFACE
              value: eth0
            - name: SOHA_NETWORK_GATEWAY_HEALTH_ADDR
              value: :8084
          ports:
            - containerPort: 51820
              name: wireguard
              protocol: UDP
            - containerPort: 8084
              name: health
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: control-tls
              mountPath: /run/soha-network-gateway/control
              readOnly: true
            - name: ingest-tls
              mountPath: /run/soha-network-gateway/ingest
              readOnly: true
            - name: gateway-data
              mountPath: /var/lib/soha-network-gateway
      volumes:
        - name: control-tls
          secret:
            secretName: soha-network-runtime-tls
            defaultMode: 0440
            items:
              - key: network-gateway-control.crt
                path: tls.crt
              - key: network-gateway-control.key
                path: tls.key
              - key: network-gateway-control-ca.crt
                path: ca.crt
        - name: ingest-tls
          secret:
            secretName: soha-network-runtime-tls
            defaultMode: 0440
            items:
              - key: network-gateway-ingest.crt
                path: tls.crt
              - key: network-gateway-ingest.key
                path: tls.key
              - key: network-gateway-ingest-ca.crt
                path: ca.crt
        - name: gateway-data
          persistentVolumeClaim:
            claimName: soha-network-gateway-data
---
apiVersion: v1
kind: Service
metadata:
  name: soha-network-gateway
  namespace: soha
spec:
  type: LoadBalancer
  selector:
    app: soha-network-gateway
  ports:
    - name: wireguard
      port: 51820
      targetPort: wireguard
      protocol: UDP
