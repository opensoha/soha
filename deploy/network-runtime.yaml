            - name: SOHA_INGEST_DATABASE_HOST
              value: soha-ingest-postgres
            - name: SOHA_INGEST_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: soha-app-config
                  key: ingest-postgres-password
            - name: SOHA_INGEST_TLS_CERT_FILE
              value: /run/soha-ingest/tls.crt
            - name: SOHA_INGEST_TLS_KEY_FILE
              value: /run/soha-ingest/tls.key
            - name: SOHA_INGEST_TLS_CLIENT_CA_FILE
