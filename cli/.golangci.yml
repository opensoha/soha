version: "2"

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

linters:
  enable:
    - govet
    - staticcheck
    - unused
    - errcheck
    - bodyclose
    - sqlclosecheck
    - gosec
    - ineffassign
    - revive
    - testifylint
    - nolintlint
  exclusions:
    paths:
      - vendor$
      - third_party$
    rules:
      - path: _test\.go$
        linters:
          - gosec
  settings:
    errcheck:
      check-type-assertions: true
    nolintlint:
      require-specific: true
      require-explanation: true
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
