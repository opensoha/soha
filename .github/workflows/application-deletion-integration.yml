name: application-deletion-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-trixie
        env:
          POSTGRES_USER: pgsql
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: soha
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U pgsql -d soha"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
      - name: Verify application and cluster deletion against isolated PostgreSQL
        env:
          GOWORK: "off"
          SOHA_APPLICATION_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOHA_APPLICATION_TEST_POSTGRES_PORT"
          git rev-parse HEAD
          go test -count=1 -timeout=10m -json \
            -run '^TestApplicationAndClusterDeletionWithPostgres$' \
            ./internal/repository/application | tee deletion-integration.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path

          name = "TestApplicationAndClusterDeletionWithPostgres"
          events = [json.loads(line) for line in Path("deletion-integration.jsonl").read_text().splitlines() if line.strip()]
          related = [event for event in events if event.get("Test") == name or event.get("Test", "").startswith(name + "/")]
          ran = any(event.get("Test") == name and event.get("Action") == "run" for event in related)
          passed = any(event.get("Test") == name and event.get("Action") == "pass" for event in related)
          incomplete = any(event.get("Action") in {"skip", "fail"} for event in related)
          if not ran or not passed or incomplete:
              raise SystemExit("Required PostgreSQL deletion regression did not run and pass completely; skipped/missing tests are not acceptance.")
          print("Required PostgreSQL deletion regression ran and passed without skipped subtests.")
          PY
      - name: Preserve integration evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: application-deletion-${{ github.sha }}
          path: deletion-integration.jsonl
          if-no-files-found: warn
