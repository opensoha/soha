name: contracts-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to recover
        required: true
        type: string
      publish_mode:
        description: Stage for human approval, or recover an already approved version
        required: true
        default: stage
        type: choice
        options:
          - stage
          - recover

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
      - run: npm ci
      - run: npm test
      - name: Go vet
        run: GOWORK=off go vet ./...
      - name: Govulncheck
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - run: npm pack --dry-run

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - soha
          - soha-web
          - soha-app
          - soha-cli
          - soha-agent
          - soha-skills
    steps:
      - uses: actions/checkout@v7
        with:
          path: soha-contracts
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Select reviewed consumer revision
        id: consumer-ref
        working-directory: soha-contracts
        env:
          CONSUMER: ${{ matrix.consumer }}
        run: node scripts/select-consumer-revision.mjs
      - uses: actions/checkout@v7
        with:
          repository: opensoha/${{ matrix.consumer }}
          path: ${{ matrix.consumer }}
          ref: ${{ steps.consumer-ref.outputs.ref }}
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: soha-contracts/go.sum
      - run: npm ci
        working-directory: soha-contracts
      - run: npm run check:consumers -- --consumer ${{ matrix.consumer }} --require-all --out "dist/consumer-matrix-${{ matrix.consumer }}.json"
        working-directory: soha-contracts
      - uses: actions/upload-artifact@v4
        with:
          name: consumer-matrix-${{ matrix.consumer }}
          path: soha-contracts/dist/consumer-matrix-${{ matrix.consumer }}.json
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs:
      - verify
      - consumers
    permissions:
      contents: write
      id-token: write
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      NPM_PUBLISH_MODE: ${{ inputs.publish_mode || 'stage' }}
      CONTRACTS_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          registry-url: "https://registry.npmjs.org"
      - name: Install staged-publishing CLI
        run: npm install --global npm@11.21.1
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
      - run: npm ci
      - name: Validate release tag
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const tag = process.env.CONTRACTS_RELEASE_TAG;
          if (typeof version !== 'string' || !/^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag || '') || tag !== `v${version}`) {
            throw new Error('Release tag must be a version tag matching package.json');
          }
          NODE
      - uses: actions/download-artifact@v4
        with:
          pattern: consumer-matrix-*
          path: dist/consumer-matrix-input
          merge-multiple: true
      - name: Merge consumer matrix
        run: |
          mkdir -p dist/release
          node --input-type=module <<'NODE'
          import { readdir, readFile, writeFile } from 'node:fs/promises';
          import { join } from 'node:path';
          const inputDir = 'dist/consumer-matrix-input';
          const files = (await readdir(inputDir)).filter((name) => name.endsWith('.json')).sort();
          if (files.length === 0) {
            throw new Error('no consumer matrix artifacts were downloaded');
          }
          const parts = await Promise.all(files.map(async (file) => JSON.parse(await readFile(join(inputDir, file), 'utf8'))));
          const version = parts[0].contractsVersion;
          const results = parts.flatMap((part) => part.results ?? []);
          const checked = parts.reduce((sum, part) => sum + Number(part.checked ?? 0), 0);
          const skipped = parts.reduce((sum, part) => sum + Number(part.skipped ?? 0), 0);
          await writeFile(
            'dist/release/consumer-matrix.json',
            `${JSON.stringify({
              schemaVersion: 1,
              contractsVersion: version,
              checked,
              skipped,
              results,
            }, null, 2)}\n`,
          );
          NODE
      - id: artifacts
        run: npm run release:artifacts -- --consumer-matrix dist/release/consumer-matrix.json
      - name: Verify release artifacts
        run: npm run release:verify -- "${{ steps.artifacts.outputs.tarball }}"
      - name: Require npm publish credentials
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && env.HAS_NPM_TOKEN != 'true'
        run: |
          echo "NPM_TOKEN is required for contracts tag releases." >&2
          exit 1
      - name: Verify public package or stage for approval
        id: publish
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          CONTRACTS_NPM_VERSION: ${{ steps.artifacts.outputs.version }}
          CONTRACTS_NPM_TARBALL: ${{ steps.artifacts.outputs.tarball }}
        run: |
          case "${NPM_PUBLISH_MODE}" in
            stage|recover) ;;
            *) echo "Unsupported npm publish mode" >&2; exit 1 ;;
          esac
          version="${CONTRACTS_NPM_VERSION}"
          tarball="${CONTRACTS_NPM_TARBALL}"
          local_integrity="sha512-$(openssl dgst -sha512 -binary "${tarball}" | openssl base64 -A)"
          if published_integrity=$(npm view "@opensoha/contracts@${version}" dist.integrity); then
            test "${published_integrity}" = "${local_integrity}"
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "Verified identical public @opensoha/contracts@${version}."
          elif [ "${NPM_PUBLISH_MODE}" = "recover" ]; then
            echo "The requested npm version is not public; approve its stage before recovery." >&2
            exit 1
          else
            npm stage publish "${tarball}" --provenance --access public --json > dist/release/npm-stage.json
            node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const raw = JSON.parse(readFileSync('dist/release/npm-stage.json', 'utf8'));
          const items = Array.isArray(raw) ? raw : [raw, ...Object.values(raw)];
          const stage = items.find((item) => item && typeof item === 'object' && typeof item.stageId === 'string');
          const integrity = `sha512-${createHash('sha512').update(readFileSync(process.env.CONTRACTS_NPM_TARBALL)).digest('base64')}`;
          if (!stage || stage.name !== '@opensoha/contracts' || stage.version !== process.env.CONTRACTS_NPM_VERSION || stage.integrity !== integrity || stage.stageId.length !== 36 || !/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i.test(stage.stageId)) {
            throw new Error('Stage receipt does not match the package, version, integrity or stage ID');
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `published=false\nstage_id=${stage.stageId}\n`);
          appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### npm stage pending approval\n\n@opensoha/contracts@${stage.version} is staged, not public.\n\nStage ID: ${stage.stageId}\n\nA maintainer must approve it with 2FA on npmjs.com. Then dispatch this workflow with the same tag and publish_mode=recover.\n`);
          NODE
          fi
      - name: Save pending stage receipt and release candidate
        if: steps.publish.outputs.published == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: contracts-staged-${{ steps.artifacts.outputs.version }}
          path: dist/release/
          if-no-files-found: error
      - name: Verify published npm package and Go module tag
        if: steps.publish.outputs.published == 'true'
        run: |
          version="${{ steps.artifacts.outputs.version }}"
          for attempt in $(seq 1 40); do
            if npm view "@opensoha/contracts@${version}" version dist.tarball dist.integrity --json; then
              break
            fi
            if [[ "${attempt}" == "40" ]]; then
              echo "published npm package @opensoha/contracts@${version} was not visible" >&2
              exit 1
            fi
            sleep 15
          done
          go list -m -json "github.com/opensoha/soha-contracts@v${version}"
      - name: GitHub release
        if: steps.publish.outputs.published == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.CONTRACTS_RELEASE_TAG }}
          generate_release_notes: true
          files: |
            ${{ steps.artifacts.outputs.tarball }}
            ${{ steps.artifacts.outputs.checksum }}
            ${{ steps.artifacts.outputs.sbom }}
            ${{ steps.artifacts.outputs.sbom_checksum }}
            ${{ steps.artifacts.outputs.provenance_policy }}
            ${{ steps.artifacts.outputs.provenance_policy_checksum }}
            ${{ steps.artifacts.outputs.manifest }}
            dist/release/consumer-matrix.json
      - name: Download published release assets and verify
        if: steps.publish.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded-release
          tarball_name="$(basename "${{ steps.artifacts.outputs.tarball }}")"
          checksum_name="$(basename "${{ steps.artifacts.outputs.checksum }}")"
          sbom_name="$(basename "${{ steps.artifacts.outputs.sbom }}")"
          sbom_checksum_name="$(basename "${{ steps.artifacts.outputs.sbom_checksum }}")"
          provenance_policy_name="$(basename "${{ steps.artifacts.outputs.provenance_policy }}")"
          provenance_policy_checksum_name="$(basename "${{ steps.artifacts.outputs.provenance_policy_checksum }}")"
          manifest_name="$(basename "${{ steps.artifacts.outputs.manifest }}")"
          gh release download "${CONTRACTS_RELEASE_TAG}" \
            --pattern "${tarball_name}" \
            --pattern "${checksum_name}" \
            --pattern "${sbom_name}" \
            --pattern "${sbom_checksum_name}" \
            --pattern "${provenance_policy_name}" \
            --pattern "${provenance_policy_checksum_name}" \
            --pattern "${manifest_name}" \
            --pattern "consumer-matrix.json" \
            --dir downloaded-release \
            --clobber
          npm run release:verify -- "downloaded-release/${tarball_name}"
