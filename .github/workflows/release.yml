name: soha-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Exact Core vX.Y.Z version (must equal the tag for tagged releases)"
        required: true
        type: string
      contracts_ref:
        description: "Optional assertion of the contracts version pinned in go.mod"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-core-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release-core
    permissions:
      actions: read
      contents: write
      packages: write
    env:
      RELEASE_VERSION: ${{ inputs.version || github.ref_name }}
      RELEASE_CORE_ENABLED: ${{ vars.RELEASE_CORE_ENABLED }}
      GH_TOKEN: ${{ github.token }}
      CONTRACTS_REF: ${{ inputs.contracts_ref }}
      GOWORK: ${{ github.workspace }}/soha/go.work
    steps:
      - name: Checkout soha
        uses: actions/checkout@v7
        with:
          path: soha
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable Core tag and source
        working-directory: soha
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_VERSION" ]]
          export RELEASE_SHA="$(git rev-parse HEAD)"
          python3 scripts/release-control.py identity --component core --tag "$RELEASE_VERSION" --sha "$RELEASE_SHA"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
          echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soha/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: |
            soha/go.sum
            soha/contracts/go.sum
            soha/cli/go.sum
            soha/agent/go.sum
      - name: Verify release version
        working-directory: soha
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$GITHUB_REF" == refs/tags/* && "$RELEASE_VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "Core version must match the exact root release tag." >&2
            exit 1
          fi
          grep -Fx -A 1 '  - name: ghcr.io/opensoha/soha' deploy/kustomization.yaml | grep -Fx "    newTag: ${RELEASE_VERSION}"
          grep -Fx "          image: ghcr.io/opensoha/soha:${RELEASE_VERSION}" deploy/deployment.yaml
      - name: Resolve runtime version
        working-directory: soha
        run: |
          echo "SOHA_BUILD_VERSION=${RELEASE_VERSION#v}" >> "$GITHUB_ENV"
      - name: Build Web and SDK from the same release commit
        working-directory: soha
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          set -euo pipefail
          npm ci
          python3 scripts/source-workspace.py check-go
          npm run build:web
          test -f internal/staticassets/web/dist/index.html
          tar --sort=name --mtime="@$SOURCE_DATE_EPOCH" --owner=0 --group=0 --numeric-owner -cf - -C web/dist . | gzip -n > ../soha-web-dist.tar.gz
          sha256sum ../soha-web-dist.tar.gz | cut -d ' ' -f1 > ../soha-web-dist.sha256
          cp .tmp/embedded-web.json ../soha-web-source-manifest.json
      - name: Verify pinned contracts module
        working-directory: soha
        run: |
          set -euo pipefail
          module_dir="$(mktemp -d "${RUNNER_TEMP:?}/soha-release-module.XXXXXX")"
          trap 'rm -rf "$module_dir"' EXIT
          GOFLAGS=-mod=readonly GOWORK=off go list -m -json github.com/opensoha/soha/contracts > "$module_dir/module.json"
          python3 - "$module_dir/module.json" <<'SDK_IDENTITY'
          import json, sys
          module = json.load(open(sys.argv[1]))
          if module.get("Path") != "github.com/opensoha/soha/contracts":
              raise SystemExit("published contracts module identity mismatch")
          if module.get("Replace") is not None:
              raise SystemExit("published contracts module must not use a replacement")
          SDK_IDENTITY
          reviewed_ref="$(GOFLAGS=-mod=readonly GOWORK=off go list -m -f '{{.Version}}' github.com/opensoha/soha/contracts)"
          [[ "${reviewed_ref}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [ -n "${CONTRACTS_REF}" ] && [ "${CONTRACTS_REF}" != "${reviewed_ref}" ]; then
            echo "contracts input differs from the reviewed go.mod dependency" >&2
            exit 1
          fi
          echo "CONTRACTS_REF=${reviewed_ref}" >> "$GITHUB_ENV"
          GOFLAGS=-mod=readonly GOWORK=off go mod download
          GOFLAGS=-mod=readonly GOWORK=off go mod verify
          GOFLAGS=-mod=readonly GOWORK=off go list -m -json github.com/opensoha/soha/contracts > "$module_dir/module.json"
          GOFLAGS=-mod=readonly GOWORK=off go mod download -json github.com/opensoha/soha/contracts > "$module_dir/download.json"
          python3 - "$module_dir/module.json" "$module_dir/download.json" <<'SDK_CHECKSUM'
          import json, sys
          module = json.load(open(sys.argv[1]))
          downloaded = json.load(open(sys.argv[2]))
          if module.get("Path") != "github.com/opensoha/soha/contracts" or downloaded.get("Path") != module.get("Path"):
              raise SystemExit("published contracts module identity mismatch")
          if module.get("Replace") is not None or not module.get("Sum"):
              raise SystemExit("published contracts module requires an unreplaced checksum")
          if downloaded.get("Version") != module.get("Version") or downloaded.get("Sum") != module["Sum"] or not downloaded.get("GoModSum"):
              raise SystemExit("published contracts version/checksum mismatch")
          SDK_CHECKSUM
          GOFLAGS=-mod=readonly GOWORK=off go list -m github.com/opensoha/soha/contracts | tee ../soha-contracts-module.txt
      - name: Qualify Core against the published Go SDK
        working-directory: soha
        run: |
          set -euo pipefail
          export GOWORK=off GOFLAGS=-mod=readonly
          qualification_dir="$(mktemp -d "${RUNNER_TEMP:?}/soha-published-sdk.XXXXXX")"
          trap 'rm -rf "$qualification_dir"' EXIT
          go test ./...
          CGO_ENABLED=0 go build -tags embedassets -trimpath -o "$qualification_dir/soha-server" ./cmd/server
      - name: Require native proxy integration with the published Go SDK
        working-directory: soha
        run: python3 scripts/run-proxy-native-tests.py --sdk-mode declared --out "$RUNNER_TEMP/proxy-native-declared.json"
      - name: Verify public npm SDK source before publishing a product release
        working-directory: soha
        run: |
          set -euo pipefail
          # Internal workspace success does not prove the SDK is publicly available.
          npm_version="${CONTRACTS_REF#v}"
          test "$(node -p "require('./contracts/package.json').version")" = "$npm_version"
          package_dir="$(mktemp -d)"
          trap 'rm -rf "$package_dir"' EXIT
          npm pack --workspace @opensoha/contracts --pack-destination "$package_dir" --json > "$package_dir/local.json"
          npm view "@opensoha/contracts@$npm_version" dist --json --registry https://registry.npmjs.org > "$package_dir/registry.json"
          node - "$package_dir" <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = require('node:path');
          const dir = process.argv[2];
          const dist = JSON.parse(fs.readFileSync(path.join(dir, 'registry.json')));
          if (!dist.tarball?.startsWith('https://registry.npmjs.org/') || !dist.integrity) throw new Error('registry-backed SDK proof required');
          const [local] = JSON.parse(fs.readFileSync(path.join(dir, 'local.json')));
          const integrity = 'sha512-' + crypto.createHash('sha512').update(fs.readFileSync(path.join(dir, local.filename))).digest('base64');
          if (integrity !== dist.integrity) throw new Error('same-source SDK differs from published npm package');
          NODE
      - name: Test
        working-directory: soha
        run: go test ./...
      - name: Require native proxy integration with the same-source SDK
        working-directory: soha
        run: python3 scripts/run-proxy-native-tests.py --sdk-mode source --out "$RUNNER_TEMP/proxy-native-source.json"
      - name: Save both native proxy dependency modes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-native-proxy-evidence
          path: ${{ runner.temp }}/proxy-native-*
          if-no-files-found: warn
      - name: Build linux amd64 binary
        working-directory: soha
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -tags embedassets -trimpath -ldflags="-s -w -X github.com/opensoha/soha/internal/application/plugin.currentSohaVersion=${SOHA_BUILD_VERSION}" -o ../soha-linux-amd64 ./cmd/server
          cd ..
          sha256sum soha-linux-amd64 > soha-linux-amd64.sha256
      - name: Set up QEMU
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/setup-buildx-action@v3
      - name: Require exclusive Core publisher before remote writes
        working-directory: soha
        run: python3 scripts/release-control.py verify --component core --tag "$RELEASE_VERSION" --sha "$RELEASE_SHA" --images-unused
      - name: Login to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Soha image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: soha
          file: soha/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/opensoha/soha:${{ github.ref_name }}
            ghcr.io/opensoha/soha:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            SOHA_BUILD_VERSION=${{ env.SOHA_BUILD_VERSION }}
      - name: Publish network gateway image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: soha
          file: soha/deploy/Dockerfile
          target: network-gateway-runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/opensoha/soha-network-gateway:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish proxy-mihomo image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: soha
          file: soha/deploy/Dockerfile
          target: proxy-runtime-mihomo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/opensoha/soha-proxy-mihomo:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish proxy-sing-box image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: soha
          file: soha/deploy/Dockerfile
          target: proxy-runtime-sing-box
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/opensoha/soha-proxy-sing-box:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish proxy-v2ray image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: soha
          file: soha/deploy/Dockerfile
          target: proxy-runtime-v2ray
          platforms: linux/amd64
          push: true
          tags: ghcr.io/opensoha/soha-proxy-v2ray:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish radius image to GHCR
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: soha
          file: soha/deploy/Dockerfile
          target: radius-runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/opensoha/soha-radius:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Generate release manifest
        run: |
          set -euo pipefail
          binary_sha256="$(cut -d ' ' -f1 soha-linux-amd64.sha256)"
          contracts_module="$(cat soha-contracts-module.txt)"
          web_sha256="$(cat soha-web-dist.sha256)"
          generated_at="$(date -u -d "@$SOURCE_DATE_EPOCH" +"%Y-%m-%dT%H:%M:%SZ")"
          cat > soha-release-manifest.json <<EOF
          {
            "version": "${RELEASE_VERSION}",
            "commit": "${GITHUB_SHA}",
            "generatedAt": "${generated_at}",
            "contractsRef": "${CONTRACTS_REF}",
            "contractsModule": "${contracts_module}",
            "webRef": "${GITHUB_SHA}",
            "webSha256": "${web_sha256}",
            "binary": {
              "name": "soha-linux-amd64",
              "goos": "linux",
              "goarch": "amd64",
              "sha256": "${binary_sha256}"
            }
          }
          EOF
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: soha-linux-amd64-${{ github.ref_name }}
          path: |
            soha-linux-amd64
            soha-linux-amd64.sha256
            soha-contracts-module.txt
            soha-release-manifest.json
            soha-web-dist.sha256
            soha-web-dist.tar.gz
            soha-web-source-manifest.json
          if-no-files-found: error
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 soha/scripts/publish-release-assets.py --component core --tag "$RELEASE_VERSION" --sha "$RELEASE_SHA" --latest --title "soha $RELEASE_VERSION" --files soha-linux-amd64 soha-linux-amd64.sha256 soha-release-manifest.json
      - name: Download published release assets and verify
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p downloaded-release
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "soha-linux-amd64" \
            --pattern "soha-linux-amd64.sha256" \
            --pattern "soha-release-manifest.json" \
            --dir downloaded-release \
            --clobber
          test -s downloaded-release/soha-linux-amd64
          test -s downloaded-release/soha-linux-amd64.sha256
          test -s downloaded-release/soha-release-manifest.json
          (cd downloaded-release && sha256sum -c soha-linux-amd64.sha256)
          grep -q '"webSha256"' downloaded-release/soha-release-manifest.json
          grep -q '"contractsModule"' downloaded-release/soha-release-manifest.json
