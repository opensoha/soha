name: contracts-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      consumer_mode:
        description: 'Pinned compatibility baseline or explicit latest-branch integration'
        type: choice
        options: [pinned, latest]
        default: pinned
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
      - name: Consumer revision selector tests
        run: node --test scripts/select-consumer-revision.checks.mjs
      - run: npm ci
      - name: Verify staged release workflow
        run: node --test scripts/release-workflow.checks.mjs
      - run: npm test
      - name: Go vet
        run: GOWORK=off go vet ./...
      - name: Govulncheck
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          only-new-issues: true
          args: --timeout=5m

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - soha
          - soha-web
          - soha-app
          - soha-cli
          - soha-agent
          - soha-skills
    steps:
      - uses: actions/checkout@v7
        with:
          path: soha-contracts
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Select consumer revision without implicit fallback
        id: consumer-ref
        working-directory: soha-contracts
        env:
          CONSUMER: ${{ matrix.consumer }}
          CONSUMER_REVISION_MODE: ${{ inputs.consumer_mode || 'pinned' }}
        run: node scripts/select-consumer-revision.mjs
      - uses: actions/checkout@v7
        with:
          repository: opensoha/${{ matrix.consumer }}
          path: ${{ matrix.consumer }}
          ref: ${{ steps.consumer-ref.outputs.ref }}
      - name: Record actual revision combination
        env:
          CONSUMER: ${{ matrix.consumer }}
          MODE: ${{ inputs.consumer_mode || 'pinned' }}
        run: |
          printf '### Consumer validation (%s)\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Contracts: `%s`\n' "$(git -C soha-contracts rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf '%s: `%s`\n' "$CONSUMER" "$(git -C "$CONSUMER" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: soha-contracts/go.sum
      - run: npm ci
        working-directory: soha-contracts
      - run: npm run check:consumers -- --consumer ${{ matrix.consumer }} --require-all
        working-directory: soha-contracts
