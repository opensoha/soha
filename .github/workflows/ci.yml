name: soha-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      latest_siblings:
        description: 'Explicit latest-branch integration instead of the fixed sibling build inputs'
        type: boolean
        default: false
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout soha
        uses: actions/checkout@v7
        with:
          path: soha
          fetch-depth: 0
      - name: Checkout contracts
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha-contracts
          path: soha-contracts
          ref: ${{ inputs.latest_siblings && 'main' || '8a00ba57145cbc2f0ba7a96bf86cbf3de77d2f2a' }}
          token: ${{ secrets.OPENSOHA_CI_TOKEN || github.token }}
      - name: Checkout web
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha-web
          path: soha-web
          ref: ${{ inputs.latest_siblings && 'main' || 'a0e958ad18f0a823de882f1ea8f5e7e866532aba' }}
          token: ${{ secrets.OPENSOHA_CI_TOKEN || github.token }}
      - name: Record actual source combination
        env:
          MODE: ${{ inputs.latest_siblings && 'latest integration' || 'fixed build inputs' }}
        run: |
          printf '### Source combination (%s)\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"
          for repo in soha soha-contracts soha-web; do
            printf '%s: `%s`\n' "$repo" "$(git -C "$repo" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'Package/Go dependencies remain owned by their checked-in manifests and locks.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: soha-web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.3"
          cache: true
          cache-dependency-path: soha/go.sum
      - name: Check Go module state
        working-directory: soha
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go module checksums
        working-directory: soha
        run: GOWORK=off go mod verify
      - name: Build web artifact
        working-directory: soha-web
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: |
          npm ci
          npm run build
      - name: Stage embedded web artifact
        working-directory: soha
        run: |
          rm -rf internal/staticassets/web/dist
          mkdir -p internal/staticassets/web/dist
          cp -R ../soha-web/dist/. internal/staticassets/web/dist/
      - name: Test
        working-directory: soha
        run: GOWORK=off go test ./...
      - name: Race test
        working-directory: soha
        run: GOWORK=off go test -race ./...
      - name: Vet
        working-directory: soha
        run: GOWORK=off go vet ./...
      - name: Production complexity gate
        working-directory: soha
        run: make complexity-check
      - name: Govulncheck
        working-directory: soha
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Prepare PR lint patch
        if: github.event_name == 'pull_request'
        working-directory: soha
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$LINT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${LINT_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$LINT_BASE_SHA" HEAD
          git diff --no-ext-diff --no-textconv --no-color --binary "$LINT_BASE_SHA" HEAD > "${RUNNER_TEMP}/soha-pr-lint.patch"
          test -s "${RUNNER_TEMP}/soha-pr-lint.patch"
      - name: Golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: soha
          # Keep the PR patch filter without the GitHub API's diff-size limits.
          args: --timeout=5m --new-from-patch=${{ runner.temp }}/soha-pr-lint.patch
      - name: Build application binaries
        working-directory: soha
        run: |
          GOWORK=off CGO_ENABLED=0 go build -tags embedassets -o /tmp/soha ./cmd/server
          GOWORK=off CGO_ENABLED=0 go build -o /tmp/network-control ./cmd/network-control
          GOWORK=off CGO_ENABLED=0 go build -o /tmp/ingest ./cmd/ingest
      - name: Verify network test assets
        working-directory: soha
        run: |
          sh deploy/network-test/generate-eap-test-pki_test.sh
          sh deploy/network-test/eapol-test_test.sh
          docker compose -f deploy/docker-compose.yaml --profile network-access --profile network-test config --quiet
      - name: Docker build
        working-directory: soha
        run: |
          docker build --build-context contracts=../soha-contracts -f deploy/Dockerfile -t ghcr.io/opensoha/soha:test -t ghcr.io/opensoha/soha:local .
          docker build --build-context contracts=../soha-contracts --target network-gateway-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-network-gateway:test .
          docker build --target radius-eap-test-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-radius-eap-test:test .
          docker build --build-context contracts=../soha-contracts --target proxy-runtime-mihomo -f deploy/Dockerfile -t ghcr.io/opensoha/soha-proxy-mihomo:test .
          docker build --build-context contracts=../soha-contracts --target proxy-runtime-sing-box -f deploy/Dockerfile -t ghcr.io/opensoha/soha-proxy-sing-box:test .
          docker build --platform linux/amd64 --build-context contracts=../soha-contracts --target proxy-runtime-v2ray -f deploy/Dockerfile -t ghcr.io/opensoha/soha-proxy-v2ray:test .
          docker build --platform linux/amd64 --build-context contracts=../soha-contracts --target radius-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-radius:test .
      - name: Verify container storage permissions
        run: >-
          docker run --rm --entrypoint sh ghcr.io/opensoha/soha:test -ec
          'test "$(id -u)" = 10001 &&
          test -x /app/soha &&
          test -x /app/network-control &&
          test -x /app/ingest &&
          mkdir -p "$SOHA_PLUGINS_COMPANION_STORAGE_DIR" &&
          touch "$SOHA_PLUGINS_COMPANION_STORAGE_DIR/.writable"'
