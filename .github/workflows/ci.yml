name: soha-ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      latest_siblings:
        description: 'Explicit latest-branch integration instead of the fixed sibling build inputs'
        type: boolean
        default: false
        required: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout soha
        uses: actions/checkout@v7
        with:
          path: soha
      - name: Checkout contracts
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha-contracts
          path: soha-contracts
          ref: ${{ inputs.latest_siblings && 'main' || '616b900b06f28d3f037e44c4d835c4828fc82060' }}
          token: ${{ secrets.OPENSOHA_CI_TOKEN || github.token }}
      - name: Checkout web
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha-web
          path: soha-web
          ref: ${{ inputs.latest_siblings && 'main' || '816ec0fb82e6e804f0f66d47d3446a7b5baeabc1' }}
          token: ${{ secrets.OPENSOHA_CI_TOKEN || github.token }}
      - name: Record actual source combination
        env:
          MODE: ${{ inputs.latest_siblings && 'latest integration' || 'fixed build inputs' }}
        run: |
          printf '### Source combination (%s)\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"
          for repo in soha soha-contracts soha-web; do
            printf '%s: `%s`\n' "$repo" "$(git -C "$repo" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          done
          printf 'Package/Go dependencies remain owned by their checked-in manifests and locks.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: soha-web/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.26.6"
          cache: true
          cache-dependency-path: soha/go.sum
      - name: Check Go module state
        working-directory: soha
        run: |
          GOWORK=off go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Verify Go module checksums
        working-directory: soha
        run: GOWORK=off go mod verify
      - name: Build web artifact
        working-directory: soha-web
        run: |
          npm ci
          npm run build
      - name: Stage embedded web artifact
        working-directory: soha
        run: |
          rm -rf internal/staticassets/web/dist
          mkdir -p internal/staticassets/web/dist
          cp -R ../soha-web/dist/. internal/staticassets/web/dist/
      - name: Test
        working-directory: soha
        run: GOWORK=off go test ./...
      - name: Race test
        working-directory: soha
        run: GOWORK=off go test -race ./...
      - name: Vet
        working-directory: soha
        run: GOWORK=off go vet ./...
      - name: Production complexity gate
        working-directory: soha
        run: make complexity-check
      - name: Govulncheck
        working-directory: soha
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...
      - name: Golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.9.0
          working-directory: soha
          only-new-issues: true
          args: --timeout=5m
      - name: Build application binaries
        working-directory: soha
        run: |
          GOWORK=off CGO_ENABLED=0 go build -tags embedassets -o /tmp/soha ./cmd/server
          GOWORK=off CGO_ENABLED=0 go build -o /tmp/network-control ./cmd/network-control
          GOWORK=off CGO_ENABLED=0 go build -o /tmp/ingest ./cmd/ingest
      - name: Verify network test assets
        working-directory: soha
        run: |
          sh deploy/network-test/generate-eap-test-pki_test.sh
          sh deploy/network-test/eapol-test_test.sh
          docker compose -f deploy/docker-compose.yaml --profile network-access --profile network-test config --quiet
      - name: Docker build
        working-directory: soha
        run: |
          docker build --build-context contracts=../soha-contracts -f deploy/Dockerfile -t ghcr.io/opensoha/soha:test -t ghcr.io/opensoha/soha:local .
          docker build --target radius-eap-test-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-radius-eap-test:test .
      - name: Verify container storage permissions
        run: >-
          docker run --rm --entrypoint sh ghcr.io/opensoha/soha:test -ec
          'test "$(id -u)" = 10001 &&
          test -x /app/soha &&
          test -x /app/network-control &&
          test -x /app/ingest &&
          mkdir -p "$SOHA_PLUGINS_COMPANION_STORAGE_DIR" &&
          touch "$SOHA_PLUGINS_COMPANION_STORAGE_DIR/.writable"'
