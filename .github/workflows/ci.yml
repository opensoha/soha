name: soha-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      core: ${{ steps.impact.outputs.core }}
      web: ${{ steps.impact.outputs.web }}
      contracts: ${{ steps.impact.outputs.contracts }}
      cli: ${{ steps.impact.outputs.cli }}
      agent: ${{ steps.impact.outputs.agent }}
      connectors: ${{ steps.impact.outputs.connectors }}
      skills: ${{ steps.impact.outputs.skills }}
      deletion: ${{ steps.impact.outputs.deletion }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Impact selector and summary counterexamples
        run: python3 -m unittest discover -s scripts -p 'test_ci_impact.py'
      - name: Route actual source changes
        id: impact
        run: python3 scripts/ci-impact.py route
  core:
    needs: route
    if: needs.route.outputs.core == 'true'
    runs-on: ubuntu-latest
    env:
      GOWORK: ${{ github.workspace }}/go.work
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: |
            go.sum
            contracts/go.sum
            cli/go.sum
            agent/go.sum
      - name: Record same-commit source combination
        run: |
          printf '### Source combination (internal-source)\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Core, Web, Contracts, CLI, Agent, Connectors, Skills: `%s`\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          sha256sum package-lock.json >> "$GITHUB_STEP_SUMMARY"
      - name: Verify same-source Go workspace and module state
        run: |
          go test ./scripts/check-module-boundaries.go ./scripts/check-module-boundaries_test.go
          python3 scripts/source-workspace.py check-go
          python3 scripts/source-workspace.py tidy
          go mod verify
      - name: Embedded artifact ownership counterexamples
        run: |
          python3 -m unittest discover -s scripts -p 'test_source_workspace.py'
          python3 -m unittest discover -s scripts -p 'test_remote_source.py'
          python3 -m unittest discover -s scripts -p 'test_release_dependency.py'
          python3 -m unittest discover -s scripts -p 'test_release_control.py'
          python3 -m unittest discover -s scripts -p 'test_publish_release_assets.py'
          python3 -m unittest discover -s scripts -p 'test_proxy_test_engines.py'
          python3 -m unittest discover -s scripts -p 'test_proxy_native_tests.py'
          python3 -m unittest discover -s scripts -p 'test_go_test_evidence.py'
      - name: Install source workspace
        run: npm ci
      - name: Build and stage same-source Web and SDK
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build:web
      - name: Test
        run: go test ./...
      - name: Race test
        run: go test -race ./...
      - name: Require isolated native proxy integration
        run: python3 scripts/run-proxy-native-tests.py --sdk-mode source --out "$RUNNER_TEMP/proxy-native-source.json"
      - name: Save native proxy evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-native-proxy-source
          path: ${{ runner.temp }}/proxy-native-source*
          if-no-files-found: warn
      - name: Vet
        run: go vet ./...
      - name: Production complexity gate
        run: make complexity-check
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Prepare PR lint patch
        if: github.event_name == 'pull_request'
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          [[ "$LINT_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${LINT_BASE_SHA}^{commit}"
          git merge-base --is-ancestor "$LINT_BASE_SHA" HEAD
          git diff --no-ext-diff --no-textconv --no-color --binary "$LINT_BASE_SHA" HEAD > "${RUNNER_TEMP}/soha-pr-lint.patch"
          test -s "${RUNNER_TEMP}/soha-pr-lint.patch"
      - name: Golangci-lint
        if: github.event_name == 'pull_request'
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          # Keep the PR patch filter without the GitHub API's diff-size limits.
          args: --timeout=5m --new-from-patch=${{ runner.temp }}/soha-pr-lint.patch
      - name: Build application binaries
        run: |
          CGO_ENABLED=0 go build -tags embedassets -o /tmp/soha ./cmd/server
          CGO_ENABLED=0 go build -o /tmp/network-control ./cmd/network-control
          CGO_ENABLED=0 go build -o /tmp/ingest ./cmd/ingest
      - name: Verify network test assets
        run: |
          sh deploy/network-test/generate-eap-test-pki_test.sh
          sh deploy/network-test/eapol-test_test.sh
          docker compose -f deploy/docker-compose.yaml --profile network-access --profile network-test config --quiet
      - name: Validate optional runtime Compose profiles
        run: docker compose -f deploy/dsh-hindsight/compose.yaml --profile dsh --profile hindsight config --quiet
      - name: Docker build
        run: |
          docker build -f deploy/Dockerfile -t ghcr.io/opensoha/soha:test -t ghcr.io/opensoha/soha:local .
          docker build --target network-gateway-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-network-gateway:test .
          docker build --target radius-eap-test-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-radius-eap-test:test .
          docker build --target proxy-runtime-mihomo -f deploy/Dockerfile -t ghcr.io/opensoha/soha-proxy-mihomo:test .
          docker build --target proxy-runtime-sing-box -f deploy/Dockerfile -t ghcr.io/opensoha/soha-proxy-sing-box:test .
          docker build --platform linux/amd64 --target proxy-runtime-v2ray -f deploy/Dockerfile -t ghcr.io/opensoha/soha-proxy-v2ray:test .
          docker build --platform linux/amd64 --target radius-runtime -f deploy/Dockerfile -t ghcr.io/opensoha/soha-radius:test .
      - name: Verify container storage permissions
        run: >-
          docker run --rm --entrypoint sh ghcr.io/opensoha/soha:test -ec
          'test "$(id -u)" = 10001 &&
          test -x /app/soha &&
          test -x /app/network-control &&
          test -x /app/ingest &&
          test -x /app/runtime-upgrade &&
          mkdir -p "$SOHA_PLUGINS_COMPANION_STORAGE_DIR" &&
          touch "$SOHA_PLUGINS_COMPANION_STORAGE_DIR/.writable"'

  web:
    needs: route
    if: needs.route.outputs.web == 'true'
    uses: ./.github/workflows/web-ci.yml
  contracts:
    needs: route
    if: needs.route.outputs.contracts == 'true'
    uses: ./.github/workflows/contracts-ci.yml
  cli:
    needs: route
    if: needs.route.outputs.cli == 'true'
    uses: ./.github/workflows/cli-ci.yml
  agent:
    needs: route
    if: needs.route.outputs.agent == 'true'
    uses: ./.github/workflows/agent-ci.yml
  connectors:
    needs: route
    if: needs.route.outputs.connectors == 'true'
    uses: ./.github/workflows/connectors-ci.yml
  skills:
    needs: route
    if: needs.route.outputs.skills == 'true'
    uses: ./.github/workflows/skills-ci.yml
  deletion:
    needs: route
    if: needs.route.outputs.deletion == 'true'
    uses: ./.github/workflows/deletion-integration.yml
  summary:
    if: always()
    needs: [route, core, web, contracts, cli, agent, connectors, skills, deletion]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Require every selected gate to succeed
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci-impact.py summary
