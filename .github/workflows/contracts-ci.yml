name: contracts-ci

on:
  workflow_call:
    inputs:
      contracts_sha:
        description: Exact full Contracts candidate commit SHA
        type: string
        required: false
      recovery_control_sha:
        description: Exact main workflow SHA, only for the owning Contracts recovery caller
        type: string
        required: false
      publish_mode:
        description: Publish mode selected in the owning Contracts release workflow
        type: string
        required: false
  workflow_dispatch:
    inputs:
      consumer_mode:
        description: 'Reviewed external compatibility baseline'
        type: choice
        options: [pinned]
        default: pinned
        required: true
      contracts_sha:
        description: 'Optional full Contracts candidate commit SHA (defaults to the event SHA; never a branch)'
        type: string
        required: false

permissions:
  contents: read

env:
  RECOVERY_CONTROL_SHA: ${{ inputs.recovery_control_sha }}
  CONTRACTS_TOOL_ROOT: ${{ github.workspace }}/${{ inputs.recovery_control_sha && 'control' || 'source' }}
  NPM_PUBLISH_MODE: ${{ inputs.publish_mode }}

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source/contracts
    steps:
      - name: Validate Contracts candidate SHA
        working-directory: .
        env:
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        run: |
          [[ "$CONTRACTS_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ -n "$RECOVERY_CONTROL_SHA" ]; then
            [[ "$RECOVERY_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = opensoha/soha
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_WORKFLOW_REF" = opensoha/soha/.github/workflows/contracts-release.yml@refs/heads/main
            test "$NPM_PUBLISH_MODE" = recover
            test "$GITHUB_SHA" = "$RECOVERY_CONTROL_SHA"
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.contracts_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: source
      - name: Checkout exact recovery consumer controls
        if: inputs.recovery_control_sha != ''
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha
          ref: ${{ inputs.recovery_control_sha }}
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            contracts/scripts/check-consumers.mjs
            contracts/scripts/select-consumer-revision.mjs
            contracts/scripts/archived-go-sdk.mjs
            contracts/scripts/archived-go-sdk.checks.mjs
            .github/legacy-go-sdk.json
            .github/legacy-goproxy
      - name: Verify exact recovery consumer controls
        if: inputs.recovery_control_sha != ''
        working-directory: control
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_CONTROL_SHA"
          test -z "$(git diff HEAD --name-only)"
      - name: Verify checked out Contracts SHA
        env:
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        working-directory: source
        run: test "$(git rev-parse HEAD)" = "$CONTRACTS_SHA"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: source/contracts/go.sum
      - name: Consumer dependency mode tests
        run: node --test scripts/check-consumer-dependency-mode.checks.mjs
      - name: Archived SDK mirror tests from selected controls
        run: node --test "$CONTRACTS_TOOL_ROOT/contracts/scripts/archived-go-sdk.checks.mjs"
      - name: Consumer revision selector tests
        run: node --test scripts/select-consumer-revision.checks.mjs
      - run: npm ci
        working-directory: source
      - name: Root workspace SDK version identity tests
        run: node --test scripts/check-version-sync.checks.mjs scripts/prepare-release-artifacts.checks.mjs
      - name: Verify staged release workflow
        run: node --test scripts/release-workflow.checks.mjs scripts/release-helpers.checks.mjs
      - name: Verify consumer CI independence and candidate selection
        env:
          # The shell fixtures stub npm and exercise the ordinary consumer path.
          RECOVERY_CONTROL_SHA: ""
        run: node --test scripts/ci-consumer-workflow.checks.mjs
      - run: npm test
        env:
          GOWORK: "off"
      - name: Go vet
        run: GOWORK=off go vet ./...
      - name: Govulncheck
        run: GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - name: Prepare PR lint patch
        if: github.event_name == 'pull_request'
        id: lint-patch
        env:
          LINT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          patch_path="${RUNNER_TEMP}/soha-pr-lint.patch"
          bash ../scripts/prepare-pr-lint-patch.sh "$LINT_BASE_SHA" "$patch_path"
          bash ../scripts/check-pr-go-format.sh "$LINT_BASE_SHA"
          printf 'args=--new-from-patch="%s"\n' "$patch_path" >> "$GITHUB_OUTPUT"
      - name: Golangci-lint
        uses: golangci/golangci-lint-action@v9
        env:
          GOWORK: 'off'
        with:
          version: v2.14.0
          working-directory: source/contracts
          only-new-issues: ${{ github.event_name != 'pull_request' }}
          args: --timeout=5m ${{ steps.lint-patch.outputs.args }}

  consumers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        consumer:
          - soha
          - soha-web
          - soha-app
          - soha-cli
          - soha-agent
          - soha-skills
    steps:
      - name: Validate Contracts candidate SHA
        working-directory: .
        env:
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        run: |
          [[ "$CONTRACTS_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ -n "$RECOVERY_CONTROL_SHA" ]; then
            [[ "$RECOVERY_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = opensoha/soha
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_WORKFLOW_REF" = opensoha/soha/.github/workflows/contracts-release.yml@refs/heads/main
            test "$NPM_PUBLISH_MODE" = recover
            test "$GITHUB_SHA" = "$RECOVERY_CONTROL_SHA"
          fi
      - uses: actions/checkout@v7
        with:
          path: source
          ref: ${{ inputs.contracts_sha || github.sha }}
          persist-credentials: false
      - name: Checkout exact recovery consumer controls
        if: inputs.recovery_control_sha != ''
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha
          ref: ${{ inputs.recovery_control_sha }}
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            contracts/scripts/check-consumers.mjs
            contracts/scripts/select-consumer-revision.mjs
            contracts/scripts/archived-go-sdk.mjs
            contracts/scripts/archived-go-sdk.checks.mjs
            .github/legacy-go-sdk.json
            .github/legacy-goproxy
      - name: Verify exact recovery consumer controls
        if: inputs.recovery_control_sha != ''
        working-directory: control
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_CONTROL_SHA"
          test -z "$(git diff HEAD --name-only)"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Select consumer revision without implicit fallback
        id: consumer-ref
        working-directory: source/contracts
        env:
          CONSUMER: ${{ matrix.consumer }}
          CONSUMER_REVISION_MODE: ${{ inputs.consumer_mode || 'pinned' }}
        run: node "$CONTRACTS_TOOL_ROOT/contracts/scripts/select-consumer-revision.mjs" --revisions-file compat/consumer-revisions.json
      - name: Validate selected consumer repository and immutable pin
        env:
          CONSUMER: ${{ matrix.consumer }}
          CONSUMER_REPOSITORY: ${{ steps.consumer-ref.outputs.repository }}
          CONSUMER_SHA: ${{ steps.consumer-ref.outputs.ref }}
        run: |
          [[ "$CONSUMER_SHA" =~ ^[a-f0-9]{40}$ ]] || exit 1
          case "$CONSUMER" in
            soha-app) test "$CONSUMER_REPOSITORY" = opensoha/soha-app ;;
            *) test "$CONSUMER_REPOSITORY" = opensoha/soha ;;
          esac
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.consumer-ref.outputs.repository }}
          path: consumers/${{ matrix.consumer }}
          ref: ${{ steps.consumer-ref.outputs.ref }}
          persist-credentials: false
      - name: Record actual revision combination
        env:
          CONSUMER: ${{ matrix.consumer }}
          MODE: ${{ inputs.consumer_mode || 'pinned' }}
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$CONTRACTS_SHA"
          printf '### Consumer validation (%s)\n' "$MODE" >> "$GITHUB_STEP_SUMMARY"
          printf 'Contracts: `%s`\n' "$(git -C source rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Consumer controls: `%s`\n' "$(git -C "$CONTRACTS_TOOL_ROOT" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          printf 'Pinned declared consumer %s: `%s`\n' "$CONSUMER" "$(git -C "consumers/$CONSUMER" rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27.4"
          cache: true
          cache-dependency-path: source/contracts/go.sum
      - run: npm ci
        id: consumer-setup
        working-directory: source
      - name: Verify declared consumer dependency without source substitution
        id: declared
        env:
          CONSUMER: ${{ matrix.consumer }}
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
          SOHA_CONSUMER_ROOT: ${{ github.workspace }}/consumers
          OPENSOHA_KEEP_VERIFY_ARTIFACTS: '1'
        run: |
          checker=(npm run check:consumers --)
          if [ -n "$RECOVERY_CONTROL_SHA" ]; then
            checker=(node "$CONTRACTS_TOOL_ROOT/contracts/scripts/check-consumers.mjs" --contracts-root "$GITHUB_WORKSPACE/source/contracts" --control-sha "$RECOVERY_CONTROL_SHA")
          fi
          "${checker[@]}" --consumer "$CONSUMER" --require-all --contracts-sha "$CONTRACTS_SHA" --declared --archived-declared-sdk --out ../../consumer-reports/declared.json
        working-directory: source/contracts
      - name: Verify candidate independently (Go uses Root; declared retains pinned external revisions)
        id: candidate
        if: ${{ !cancelled() && steps.consumer-setup.outcome == 'success' }}
        env:
          CONSUMER: ${{ matrix.consumer }}
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
          SOHA_CONSUMER_ROOT: ${{ github.workspace }}/consumers
          OPENSOHA_KEEP_VERIFY_ARTIFACTS: '1'
        run: |
          checker=(npm run check:consumers --)
          if [ -n "$RECOVERY_CONTROL_SHA" ]; then
            checker=(node "$CONTRACTS_TOOL_ROOT/contracts/scripts/check-consumers.mjs" --contracts-root "$GITHUB_WORKSPACE/source/contracts" --control-sha "$RECOVERY_CONTROL_SHA")
          fi
          case "$CONSUMER" in
            soha|soha-cli|soha-agent)
              SOHA_CONSUMER_ROOT="$GITHUB_WORKSPACE/source" "${checker[@]}" --internal-source --consumer "$CONSUMER" --require-all --contracts-sha "$CONTRACTS_SHA" --out ../../consumer-reports/candidate.json
              ;;
            *)
              "${checker[@]}" --consumer "$CONSUMER" --require-all --contracts-sha "$CONTRACTS_SHA" --contracts-skill-schema "$GITHUB_WORKSPACE/source/contracts/skills/skill-manifest.schema.json" --contracts-mcp-preset-schema "$GITHUB_WORKSPACE/source/contracts/presets/mcp-preset.schema.json" --contracts-agent-profile-schema "$GITHUB_WORKSPACE/source/contracts/profiles/agent-profile.schema.json" --contracts-permission-catalog "$GITHUB_WORKSPACE/source/contracts/auth/permission-catalog.json" --out ../../consumer-reports/candidate.json
              ;;
          esac
        working-directory: source/contracts
      - name: Report both dependency modes
        if: always()
        env:
          CONSUMER: ${{ matrix.consumer }}
          DECLARED_RESULT: ${{ steps.declared.outcome }}
          CANDIDATE_RESULT: ${{ steps.candidate.outcome }}
        run: |
          case "$CONSUMER" in
            soha|soha-cli|soha-agent) candidate_mode=internal-source ;;
            *) candidate_mode=candidate-source ;;
          esac
          printf 'Declared dependency (pinned): `%s`\nCandidate (%s): `%s`\n' "$DECLARED_RESULT" "$candidate_mode" "$CANDIDATE_RESULT" >> "$GITHUB_STEP_SUMMARY"
      - name: Save dependency mode reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: consumer-${{ matrix.consumer }}-reports
          path: |
            consumer-reports/*.json
            ${{ runner.temp }}/opensoha-consumer-native-*/**
          if-no-files-found: warn

  internal-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - name: Validate Contracts candidate SHA
        working-directory: .
        env:
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        run: |
          [[ "$CONTRACTS_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          if [ -n "$RECOVERY_CONTROL_SHA" ]; then
            [[ "$RECOVERY_CONTROL_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REPOSITORY" = opensoha/soha
            test "$GITHUB_REF" = refs/heads/main
            test "$GITHUB_WORKFLOW_REF" = opensoha/soha/.github/workflows/contracts-release.yml@refs/heads/main
            test "$NPM_PUBLISH_MODE" = recover
            test "$GITHUB_SHA" = "$RECOVERY_CONTROL_SHA"
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          ref: ${{ inputs.contracts_sha || github.sha }}
          path: source
      - name: Checkout exact recovery consumer controls
        if: inputs.recovery_control_sha != ''
        uses: actions/checkout@v7
        with:
          repository: opensoha/soha
          ref: ${{ inputs.recovery_control_sha }}
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            contracts/scripts/check-consumers.mjs
            contracts/scripts/select-consumer-revision.mjs
            contracts/scripts/archived-go-sdk.mjs
            contracts/scripts/archived-go-sdk.checks.mjs
            .github/legacy-go-sdk.json
            .github/legacy-goproxy
      - name: Verify exact recovery consumer controls
        if: inputs.recovery_control_sha != ''
        working-directory: control
        run: |
          test "$(git rev-parse HEAD)" = "$RECOVERY_CONTROL_SHA"
          test -z "$(git diff HEAD --name-only)"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.4'
          cache-dependency-path: |
            source/go.sum
            source/contracts/go.sum
            source/cli/go.sum
            source/agent/go.sum
      - name: Verify checked out Contracts SHA
        env:
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$CONTRACTS_SHA"
      - run: npm ci
      - run: npm run generate --workspace @opensoha/contracts
      - name: Verify five same-source consumers separately from external compatibility
        env:
          OPENSOHA_KEEP_VERIFY_ARTIFACTS: '1'
          CONTRACTS_SHA: ${{ inputs.contracts_sha || github.sha }}
        run: |
          checker=(node contracts/scripts/check-consumers.mjs)
          if [ -n "$RECOVERY_CONTROL_SHA" ]; then
            checker=(node "$CONTRACTS_TOOL_ROOT/contracts/scripts/check-consumers.mjs" --contracts-root "$GITHUB_WORKSPACE/source/contracts" --control-sha "$RECOVERY_CONTROL_SHA")
          fi
          "${checker[@]}" --internal-source --require-all --contracts-sha "$CONTRACTS_SHA" --out "$GITHUB_WORKSPACE/internal-source-report.json"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: internal-source-report
          path: |
            internal-source-report.json
            ${{ runner.temp }}/opensoha-consumer-native-*/**
          if-no-files-found: warn
