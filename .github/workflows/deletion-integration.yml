name: deletion-integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-trixie
        env:
          POSTGRES_DB: soha
          POSTGRES_USER: pgsql
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U pgsql -d soha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
          cache: true
      - name: Dedicated lab guards without deployment or models
        run: python3 -m unittest discover -s scripts -p 'test_quality_lab.py'
      - name: Run actual PostgreSQL deletion scenarios
        env:
          GOWORK: "off"
          SOHA_APPLICATION_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          SOHA_CATALOG_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
          SOHA_MANIFEST_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOHA_APPLICATION_TEST_POSTGRES_PORT"
          git rev-parse HEAD
          go test -json -count=1 -race -timeout=10m \
            -run '^TestApplicationAndClusterDeletionWithPostgres$' \
            ./internal/repository/application | tee deletion-test.json
          python3 scripts/check-go-test-evidence.py deletion-test.json --exit-code 0
          go test -json -count=1 -race -timeout=10m -run '^TestMainSessionWithPostgres$' ./internal/repository/copilot | tee main-chat-test.json
          python3 scripts/check-go-test-evidence.py main-chat-test.json --exit-code 0 --main-chat
          go test -json -count=1 -race -timeout=10m -run '^TestSessionAuthorizationWithPostgres$' ./internal/repository/copilot | tee identity-test.json
          python3 scripts/check-go-test-evidence.py identity-test.json --exit-code 0 --identity
          go test -json -count=1 -race -timeout=10m -run '^TestKubernetesImportIdentityWithPostgres$' ./internal/repository/delivery | tee kubernetes-import-test.json
          python3 scripts/check-go-test-evidence.py kubernetes-import-test.json --exit-code 0 --kubernetes-import
          go test -json -count=1 -race -timeout=10m -run '^TestServiceReferenceCandidatesWithPostgres$' ./internal/repository/delivery | tee service-reference-candidates-test.json
          python3 scripts/check-go-test-evidence.py service-reference-candidates-test.json --exit-code 0 --service-reference-candidates
          go test -json -count=1 -race -timeout=10m -run '^(TestServiceReferencesPostgres|TestServiceReferenceImpactsPostgres)$' ./internal/repository/delivery | tee service-references-test.json
          python3 scripts/check-go-test-evidence.py service-references-test.json --exit-code 0 --service-references
          go test -json -count=1 -race -timeout=10m -run '^TestTemplateAdoptionRecoveryWithPostgres$' ./internal/application/delivery | tee template-adoption-recovery-test.json
          python3 scripts/check-go-test-evidence.py template-adoption-recovery-test.json --exit-code 0 --template-adoption-recovery
          go test -json -count=1 -race -timeout=10m -run '^TestTemplateAdoptionWithPostgres$' ./internal/repository/templateupdate | tee template-adoption-test.json
          python3 scripts/check-go-test-evidence.py template-adoption-test.json --exit-code 0 --template-adoption
          go test -json -count=1 -race -timeout=10m -run '^TestTemplateVersionsWithPostgres$' ./internal/repository/catalog | tee template-migration-test.json
          python3 scripts/check-go-test-evidence.py template-migration-test.json --exit-code 0 --template-migration
          go test -json -count=1 -race -timeout=10m -run '^TestDeliverySnapshotWithPostgres$' ./internal/repository/manifest | tee manifest-migration-test.json
          python3 scripts/check-go-test-evidence.py manifest-migration-test.json --exit-code 0 --manifest-migration
          python3 scripts/check-go-test-evidence.py manifest-migration-test.json --exit-code 0 --manifest-control
      - name: Evidence validator counterexamples
        run: python3 -m unittest discover -s scripts -p 'test_go_test_evidence.py'
      - name: OCR integrity counterexamples without models
        run: python3 -m unittest discover -s .agents/skills/soha-security/scripts -p 'test_ocr.py'
      - name: Build fixed OCR and validate actual rules without network/models
        run: |
          set -euo pipefail
          docker build -t opensoha-ocr:1.12.11 .agents/skills/soha-security/tools
          export SOHA_OCR_TEST_IMAGE=$(docker image inspect opensoha-ocr:1.12.11 --format '{{.Id}}')
          python3 -m unittest discover -s .agents/skills/soha-security/scripts -p 'test_ocr_preview.py'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-deletion-test
          path: |
            deletion-test.json
            main-chat-test.json
            identity-test.json
            kubernetes-import-test.json
            service-reference-candidates-test.json
            service-references-test.json
            template-adoption-recovery-test.json
            template-adoption-test.json
            template-migration-test.json
            manifest-migration-test.json
          if-no-files-found: warn
