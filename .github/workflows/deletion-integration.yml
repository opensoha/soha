name: deletion-integration

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-deletion:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg18-trixie
        env:
          POSTGRES_DB: soha
          POSTGRES_USER: pgsql
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U pgsql -d soha"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Dedicated lab guards without deployment or models
        run: python3 -m unittest discover -s scripts -p 'test_quality_lab.py'
      - name: Run actual PostgreSQL deletion scenarios
        env:
          GOWORK: "off"
          SOHA_APPLICATION_TEST_POSTGRES_PORT: ${{ job.services.postgres.ports[5432] }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SOHA_APPLICATION_TEST_POSTGRES_PORT"
          git rev-parse HEAD
          go test -json -count=1 -race -timeout=10m \
            -run '^TestApplicationAndClusterDeletionWithPostgres$' \
            ./internal/repository/application | tee deletion-test.json
          python3 scripts/check-go-test-evidence.py deletion-test.json --exit-code 0
      - name: Evidence validator counterexamples
        run: python3 -m unittest discover -s scripts -p 'test_go_test_evidence.py'
      - name: OCR integrity counterexamples without models
        run: python3 -m unittest discover -s .agents/skills/soha-security/scripts -p 'test_ocr.py'
      - name: Build fixed OCR and validate actual rules without network/models
        run: |
          set -euo pipefail
          docker build -t opensoha-ocr:1.12.11 .agents/skills/soha-security/tools
          export SOHA_OCR_TEST_IMAGE=$(docker image inspect opensoha-ocr:1.12.11 --format '{{.Id}}')
          python3 -m unittest discover -s .agents/skills/soha-security/scripts -p 'test_ocr_preview.py'
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgres-deletion-test
          path: deletion-test.json
          if-no-files-found: warn
