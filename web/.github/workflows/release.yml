name: web-release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      contracts_version:
        description: 'Optional assertion of the contracts version locked in this release'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CONTRACTS_VERSION: ${{ inputs.contracts_version }}
    steps:
      - name: Checkout web
        uses: actions/checkout@v7
        with:
          path: soha-web
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: soha-web/package-lock.json
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: soha-web
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}"
      - name: Install release dependencies
        working-directory: soha-web
        run: |
          set -euo pipefail
          node -e "const pkg=require('./package.json'); const lock=require('./package-lock.json'); const dep=pkg.dependencies['@opensoha/contracts']; const entry=lock.packages['node_modules/@opensoha/contracts']; if (!/^\d+\.\d+\.\d+$/.test(dep)) throw new Error('contracts dependency must be an exact release version'); if (process.env.CONTRACTS_VERSION && dep !== process.env.CONTRACTS_VERSION) throw new Error('contracts input differs from the reviewed dependency'); if (!entry || entry.version !== dep || !entry.integrity) throw new Error('contracts lock entry does not match release version'); if (!String(entry.resolved || '').startsWith('https://registry.npmjs.org/')) throw new Error('contracts release dependency must resolve from npm');"
          npm ci --no-audit --no-fund
      - name: Lint
        working-directory: soha-web
        run: npm run lint
      - name: Format check
        working-directory: soha-web
        run: npm run format:check
      - name: Test
        working-directory: soha-web
        run: npm test
      - name: Coverage
        working-directory: soha-web
        run: npm run test:coverage
      - name: Build
        working-directory: soha-web
        run: npm run build
      - name: Package dist
        working-directory: soha-web
        run: |
          asset="soha-web-dist-${GITHUB_REF_NAME}.tar.gz"
          test -f dist/index.html
          tar -C dist -czf "../${asset}" .
          cd ..
          sha256sum "${asset}" > "${asset}.sha256"
          sha256sum -c "${asset}.sha256"
          node soha-web/scripts/verify-release-artifact.mjs --artifact "${asset}"
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: soha-web-dist-${{ github.ref_name }}
          path: |
            soha-web-dist-${{ github.ref_name }}.tar.gz
            soha-web-dist-${{ github.ref_name }}.tar.gz.sha256
          if-no-files-found: error
      - name: Publish GitHub release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.OPENSOHA_CI_TOKEN || github.token }}
        run: |
          asset="soha-web-dist-${GITHUB_REF_NAME}.tar.gz"
          checksum="${asset}.sha256"
          test -s "${asset}"
          test -s "${checksum}"
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${asset}" "${checksum}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${asset}" "${checksum}" --repo "${GITHUB_REPOSITORY}" --title "soha-web ${GITHUB_REF_NAME}" --generate-notes
          fi
      - name: Download published release assets and verify
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.OPENSOHA_CI_TOKEN || github.token }}
        run: |
          set -euo pipefail
          asset="soha-web-dist-${GITHUB_REF_NAME}.tar.gz"
          mkdir -p downloaded-release
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${asset}" \
            --pattern "${asset}.sha256" \
            --dir downloaded-release \
            --clobber
          node soha-web/scripts/verify-release-artifact.mjs --artifact "downloaded-release/${asset}"
