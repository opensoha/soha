name: skills-release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - name: Derive release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Validate schemas and package assets
        run: python3 tools/validate_assets.py --release-version "${{ steps.version.outputs.value }}" --package-output-dir dist --report-output "dist/soha-skills-${{ steps.version.outputs.value }}.validation-report.json"
      - name: Verify packaged release assets
        run: python3 tools/validate_assets.py --release-version "${{ steps.version.outputs.value }}" --verify-package "dist/soha-skills-${{ steps.version.outputs.value }}.tar.gz"
      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/soha-skills-${{ steps.version.outputs.value }}.tar.gz
            dist/soha-skills-${{ steps.version.outputs.value }}.tar.gz.sha256
            dist/soha-skills-${{ steps.version.outputs.value }}.manifest.json
            dist/soha-skills-${{ steps.version.outputs.value }}.validation-report.json
      - name: Upload validation report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-validation-report-${{ steps.version.outputs.value }}
          path: dist/soha-skills-${{ steps.version.outputs.value }}.validation-report.json
          if-no-files-found: error
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/soha-skills-${{ steps.version.outputs.value }}.tar.gz
            dist/soha-skills-${{ steps.version.outputs.value }}.tar.gz.sha256
            dist/soha-skills-${{ steps.version.outputs.value }}.manifest.json
            dist/soha-skills-${{ steps.version.outputs.value }}.validation-report.json
      - name: Download published release assets and verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p downloaded-release
          gh release download "${GITHUB_REF_NAME}" \
            --pattern "soha-skills-${{ steps.version.outputs.value }}*" \
            --dir downloaded-release \
            --clobber
          python3 tools/validate_assets.py \
            --release-version "${{ steps.version.outputs.value }}" \
            --verify-package "downloaded-release/soha-skills-${{ steps.version.outputs.value }}.tar.gz"
